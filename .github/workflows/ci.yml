name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The build applies migrations now, so these are connected to for real.
      # `ci` is the database the build migrates; `shadow` is kept empty for the
      # drift check below, which is why they cannot be the same one.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      # Test-only values. The tests exercise column encryption and the share
      # passcode, both of which fail closed without a key rather than quietly
      # writing plaintext — which is the behaviour, so they need one here.
      FIELD_ENCRYPTION_KEY: ci-only-key-not-for-any-real-data-0123456789
      CONFIRM_LINK_SECRET: ci-only-confirm-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Migration manifest is current
        # /api/health reads this list to say which migrations a database is
        # missing. The build regenerates it, so a stale committed copy would be
        # invisible until it silently under-reported in production.
        run: node scripts/write-migration-manifest.mjs --check

      - run: npm run lint
      - run: npm run typecheck

      - name: Template definitions hold together
        # `TemplateField` is a structure, so the compiler checks its shape and
        # nothing about whether it makes sense: a `choice` with no options, two
        # fields sharing an id, and a field id named as a string literal from
        # another module all compile whether or not they are real. Rename
        # `riskSuicidal` and the dashboard chip, the PDF's clinician statement
        # and the encounter-type filename each silently return nothing.
        run: npm run verify:templates

      - name: Portal actions point somewhere that honours them
        # A persona's primary action is a bare href, so nothing type-checks that
        # the page at the other end exists, reads the query parameter it is
        # handed, or offers the template it names. "Record a visit" once pointed
        # at a page with no microphone on it and no searchParams at all, and
        # lint, typecheck and build were all green. Needs no database.
        run: npm run verify:portals

      - name: No clinical document leaves as bytes
        # The WhatsApp handoff was hardened by replacing `sendDocument` with an
        # expiring link on every path — except it was not every path. The
        # caseload roster was missed, so a clinician's whole client list, names
        # included when ticked, was pushed to Meta as an attachment. Lint,
        # typecheck, build and the tests were all green, and both CLAUDE.md and
        # SECURITY.md asserted the migration was finished. The claim is a check
        # now. Needs no database.
        run: npm run verify:handoff

      - name: The Word export is a file Word will open
        # A `.docx` is a ZIP of XML parts, and it fails the way this repository
        # keeps being bitten: the build is green, the bytes are the right length,
        # and Word reports "corrupt" without saying which of five parts is wrong.
        # An unescaped `&` in clinical prose is a fatal parse error, not a
        # rendering glitch. Unzips the result and checks the structure Word
        # requires rather than the structure the writer happens to emit. No
        # database.
        run: npm run verify:docx

      - run: npm run build

      - name: Tests
        # Against the real PostgreSQL service above, not a mock. Every bug this
        # codebase has actually shipped — an export where every section read
        # "not recorded", a picker whose answers all hashed alike, a form that
        # wiped itself — passed a type check and a build. Mocking Prisma would
        # reproduce exactly that blind spot.
        #
        # Runs after the build because the build is what applies migrations to
        # the `ci` database.
        run: npm test

      - name: No clinical text is readable in a database dump
        # The check that actually found things. Column encryption was written,
        # type-checked, linted, built and unit-tested — and three columns were
        # still plaintext afterwards: SubmissionFlag.detail (holding the
        # classifier's "records suicidal ideation denied on direct
        # questioning"), Client.statusReason, and ClientStatusEvent.reason,
        # which survived even after the client column had been sealed.
        #
        # None were in the plan, because the plan surveyed the obvious columns.
        # Grepping the artefact is the only method that finds the column nobody
        # thought of — the same lesson as unzipping the export.
        #
        # Seeds first: the phrases asserted on are the seed's own invented
        # clients, which is what makes them safe to keep in a repository.
        run: |
          npx prisma db seed
          npm run verify:at-rest

      - name: Migrations apply with only the integration's variables
        # The deployment platform may supply POSTGRES_PRISMA_URL and no
        # DATABASE_URL at all — that is what the Supabase↔Vercel integration
        # writes — and that exact shape shipped broken. Prisma validates the
        # whole datasource block before using any of it, so `url =
        # env("DATABASE_URL")` failed with P1012 before a connection was tried,
        # and every candidate in the fallback chain was refused at the door.
        #
        # It survived review and two green builds because nothing exercised it:
        # a developer has DATABASE_URL in .env, CI has it in `env:` above, and
        # production is the only place without one. Hence `env -u`.
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -p 5432 -U ci -d ci -c 'CREATE DATABASE integration_vars;'
          env -u DATABASE_URL -u DIRECT_URL \
            POSTGRES_PRISMA_URL="postgresql://ci:ci@localhost:5432/integration_vars?schema=public" \
            node scripts/migrate-on-deploy.mjs
          applied=$(psql -h localhost -p 5432 -U ci -d integration_vars -tAc \
            'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL;')
          expected=$(ls -d prisma/migrations/*/ | wc -l)
          echo "applied=$applied expected=$expected"
          [ "$applied" = "$expected" ] || {
            echo "migrate-on-deploy did not apply every migration using only POSTGRES_PRISMA_URL"
            exit 1
          }

      - name: Create the shadow database
        # Separate from DATABASE_URL, and that separation is the whole point.
        # `migrate diff` replays every migration into the shadow database from
        # nothing, so it has to start empty. Once the build began applying
        # migrations to DATABASE_URL, pointing the check at that same database
        # failed with P3006 on the very first migration — a real CI failure
        # that looked like schema drift and was not.
        env:
          PGPASSWORD: ci
        run: psql -h localhost -p 5432 -U ci -d ci -c 'CREATE DATABASE shadow;'

      - name: Migration matches schema
        # Catches the commonest way a migration drifts: someone edits
        # schema.prisma and forgets the SQL, so `migrate deploy` produces a
        # database the application's queries do not fit.
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code || {
              echo "prisma/migrations is out of date with prisma/schema.prisma"
              exit 1
            }
